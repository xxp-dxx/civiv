name: Package Civiv Bot

on:
  push:
    branches:
      - civiv-gameplay-overhaul-2026-09-26

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create project ZIP
        run: |
          cd "faction-empires-bot (1)"
          zip -r ../civiv-bot.zip faction-empires-bot -x "*/__pycache__/*"
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: civiv-bot-package
          path: civiv-bot.zip
